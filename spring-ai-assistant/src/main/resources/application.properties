spring.application.name=spring-ai-assistant
assistant.prompt.system=${ASSISTANT_SYSTEM_PROMPT:You are a concise and accurate assistant.}
assistant.stream.signal-timeout=${ASSISTANT_STREAM_SIGNAL_TIMEOUT:30s}
assistant.generation.max-output-tokens=${ASSISTANT_MAX_OUTPUT_TOKENS:1024}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${OPENAI_MODEL}
spring.ai.openai.base-url=${OPENAI_BASE_URL}
